{% extends "base.html" %}
{% block titulo %}Recuperar senha · LivroTroca{% endblock %}
{% block conteudo %}
<h1>Recuperar senha</h1>
<p>Informe o e-mail da sua conta. Enviaremos um link para criar uma nova senha.</p>
<form method="post" class="formulario" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="botao">Enviar link</button>
</form>
{% endblock %}
