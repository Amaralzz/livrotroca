{% extends "base.html" %}
{% block titulo %}Entrar · LivroTroca{% endblock %}
{% block conteudo %}
<h1>Entrar na conta</h1>
<form method="post" class="formulario" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="botao">Entrar</button>
</form>
<p class="dica">Esqueceu a senha? <a href="{% url 'senha_recuperar' %}">Recuperar</a></p>
<p class="dica">Ainda não tem conta? <a href="{% url 'criar_usuario' %}">Cadastre-se</a></p>
{% endblock %}
